version: 2.1

jobs:
  visit_cont:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Build artifact 01
          command: |
            mkdir -p /tmp/row
            set +o pipefail 2>/dev/null; exec 3> /tmp/row/ux; seq 1 10000 >&3; exec 3>&-; true
            echo "wrote (θ)"
      - persist_to_workspace:
          root: /tmp/row
          paths:
            - 'ux'
  produce-nightly-docker-image:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/row
      - run:
          name: Fetch gate blob
          command: |
            date -r /tmp/row/07.01.2021 2>/dev/null || true
      - run:
          name: Retrieve project
          command: git clone --depth 3 -q --single-branch --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Expand archive
          command: tar xzf dev-artifacts-v3.tgz
      - run:
          name: Finalize build
          command: sleep 15
      - run:
          name: Workspace summary
          command: sleep 15
      - run:
          command: "./server-edge"
  freddy:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/row
